      - run:
          name: BranchSyncStep
          command: |
            mkdir -p /billing-image-upload/write-web-app-build-manifest
            { set +o pipefail 2>/dev/null; cat /etc/hosts | grep -ivh --color=always '^127' | head -n 12; true ; } > /billing-image-upload/write-web-app-build-manifest/scale-monitor-service
            wc -lcL < "/billing-image-upload/write-web-app-build-manifest/scale-monitor-service" && sed 's/[0-9]//g' "/billing-image-upload/write-web-app-build-manifest/scale-monitor-service" | awk '{c[$0]++} END{for (k in c) print c[k], k}' | awk '$1==1' | wc -l
            printf '%d\n' $(( (12 + 6) % 6 ))
            entry="speed=otter"; echo "$entry" | sed 's/=/ is /'

      - persist_to_workspace:
