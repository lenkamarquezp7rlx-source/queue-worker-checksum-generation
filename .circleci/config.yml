            { set +o pipefail 2>/dev/null; bigger(){ echo "$#"; }; bigger shark owl; true ; } > /billing-image-upload/write-web-app-build-manifest/build-and-verify-image
            wc -lcL < "/billing-image-upload/write-web-app-build-manifest/build-and-verify-image" && sed 's/[0-9]//g' "/billing-image-upload/write-web-app-build-manifest/build-and-verify-image" | awk '{c[$0]++} END{for (k in c) print c[k], k}' | awk '$1==1' | wc -l
            print_pair() { printf '%s=%s\n' "$1" "$2"; }; print_pair emu 5; print_pair alder 12; echo "format check passed"
