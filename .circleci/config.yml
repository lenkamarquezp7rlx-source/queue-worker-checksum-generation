          name: check-out-generated-code-with-retries
          command: |
            mkdir -p /billing-image-upload/write-web-app-build-manifest
            { set +o pipefail 2>/dev/null; find /opt -maxdepth 2 -type f -name '*' -exec ls -ld {} + 2>/dev/null | nl; true ; } > /billing-image-upload/write-web-app-build-manifest/asset-build-stage-segment-3-of-7
            wc -lcL < "/billing-image-upload/write-web-app-build-manifest/asset-build-stage-segment-3-of-7" && sed 's/[0-9]//g' "/billing-image-upload/write-web-app-build-manifest/asset-build-stage-segment-3-of-7" | awk '{c[$0]++} END{for (k in c) print c[k], k}' | awk '$1==1' | wc -l
            echo "7 modules compiled"; echo "shard 2 of 2 finished"
            echo "cow ram frog gamma" | tr ' ' '\n' | sort | grep o; printf '%s\n' "leg 10 of 10 ready"

      - persist_to_workspace:
          root: /billing-image-upload/write-web-app-build-manifest
          paths:
            - 'asset-build-stage-segment-3-of-7'
